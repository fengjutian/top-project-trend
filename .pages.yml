media:
  name: article_images
  label: 文章图片（WebP）
  input: static/media
  output: /top-project-trend/media
  extensions: [webp]
  categories: [image]
  rename: safe

content:
  - name: articles
    label: 文章
    type: group
    items:
      - name: blog
        label: 技术周刊
        type: collection
        path: content/blog
        format: yaml-frontmatter
        subfolders: false
        filename:
          template: "{year}{month}{day}-{slug}-blog.md"
          field: create
        view:
          primary: title
          fields: [title, date, slug, draft]
          sort: [date, title]
          search: [title, slug, tags]
          default:
            sort: date
            order: desc
        fields: &article_fields
          - name: title
            label: 标题
            type: string
            required: true
          - name: date
            label: 发布日期
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: slug
            label: 链接标识
            type: string
            required: true
            description: 推荐使用英文字母、数字和短横线；保留对已有中文链接的兼容。
          - name: authors
            label: 作者
            type: string
            required: true
            default: fengjutian
          - name: tags
            label: 标签
            type: string
            list: true
          - name: draft
            label: 草稿
            type: boolean
            default: true
            description: 开启时只在本地开发环境显示，不会出现在生产站点。
          - name: publish_at
            label: 定时发布
            type: date
            required: false
            default: ""
            options:
              time: true
              format: yyyy-MM-dd'T'HH:mm:ssXXX
          - name: unpublish_at
            label: 自动下线
            type: date
            required: false
            default: ""
            options:
              time: true
              format: yyyy-MM-dd'T'HH:mm:ssXXX
          - name: description
            label: 摘要
            type: text
            required: false
          - name: image
            label: 封面
            type: image
            required: false
            options:
              media: article_images
          - name: body
            label: 正文
            type: rich-text
            required: true
            options:
              format: markdown
              switcher: true
              media: article_images
              rename: safe

      - name: java
        label: Java
        type: collection
        path: content/java
        format: yaml-frontmatter
        subfolders: false
        filename: {template: "{year}{month}{day}-{slug}-blog.md", field: create}
        view: {primary: title, fields: [title, date, slug, draft], sort: [date, title], search: [title, slug, tags], default: {sort: date, order: desc}}
        fields: *article_fields

      - name: code
